security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        # Fournisseur en mémoire tant qu'aucune entité utilisateur n'existe.
        # Les VOTERS, eux, n'attendent pas l'authentification pour être écrits :
        # ils expriment « qui a le droit de faire quoi sur ce dossier » en
        # règles, et non en `if` dispersés dans les contrôleurs.
        utilisateurs:
            memory:
                users: []

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        principal:
            lazy: true
            provider: utilisateurs

    access_control: []

when@test:
    security:
        password_hashers:
            # Le coût par défaut rend la suite de tests inutilisablement lente :
            # chaque hachage est VOLONTAIREMENT coûteux, et un test en fait
            # des dizaines.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10

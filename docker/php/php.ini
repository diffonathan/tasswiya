; Réglages de PHP pour le DÉVELOPPEMENT de Tasswiya.
;
; L'essentiel de ce fichier existe pour une raison : le code est monté depuis
; Windows dans le conteneur, et chaque lecture traverse le pont de fichiers de
; Docker Desktop. Une requête Symfony ouvre plusieurs centaines de fichiers ;
; sans les caches ci-dessous elle met plusieurs secondes à répondre, et
; l'application paraît cassée alors qu'elle attend le disque.

[opcache]
opcache.enable = 1

; INDISPENSABLE ici, et facile à manquer : `php -S` est le serveur intégré de
; PHP, lancé par le SAPI **CLI**, où opcache est désactivé par défaut. Sans
; cette ligne tout le reste du fichier se lit correctement dans phpinfo() et
; n'a AUCUN effet.
opcache.enable_cli = 1

opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16

; Symfony et ses dépendances dépassent largement les 10 000 fichiers par
; défaut. Au-delà du plafond, opcache cesse simplement de mettre en cache —
; sans prévenir, et c'est précisément le symptôme qu'on cherche à éviter.
opcache.max_accelerated_files = 20000

; En développement on VEUT que les modifications soient prises en compte, mais
; pas au prix d'un appel système par fichier et par requête.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

; Le cache des chemins résolus. Sur un montage lent c'est lui qui évite le plus
; d'allers-retours : chaque `require` relatif provoque sinon une résolution
; complète à travers le pont.
realpath_cache_size = 8M
realpath_cache_ttl = 600

[PHP]
; 256 Mo bornent une boucle emballée tout en laissant passer la construction du
; conteneur de services, qui est le moment le plus gourmand.
memory_limit = 256M

; Le fuseau du projet. Sans lui PHP retombe sur UTC, et une échéance calculée
; en fin de journée bascule d'un jour — sur un produit qui ne parle que de
; délais, ce serait la faute la plus grave possible.
date.timezone = Africa/Casablanca

; Réglages de PHP en PRODUCTION.
;
; La différence avec le développement tient en une ligne : opcache ne revalide
; plus les horodatages. En production le code ne change pas entre deux
; démarrages, et vérifier la date de chaque fichier à chaque requête coûte un
; appel système pour rien. Un déploiement crée un conteneur neuf, donc un cache
; neuf.

[opcache]
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 96
opcache.interned_strings_buffer = 12
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

realpath_cache_size = 4M
realpath_cache_ttl = 600

[PHP]
; 128 Mo et non 256 : la cible de déploiement plafonne à 512 Mo pour PHP ET
; PostgreSQL réunis (contrainte n° 2 du cahier). Quatre processus du serveur
; intégré à 256 Mo autorisés chacun dépasseraient à eux seuls le plafond.
memory_limit = 128M
date.timezone = Africa/Casablanca

; Jamais dans la page : un message d'erreur PHP affiché à un visiteur révèle
; des chemins, des versions, parfois des requêtes.
display_errors = Off
log_errors = On
error_log = /dev/stderr
